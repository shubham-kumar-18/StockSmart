<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">PURCHASING</span><strong>Supplier setup</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a class="active" th:href="@{/suppliers}">Suppliers</a><a th:href="@{/purchase-orders}">Purchase Orders</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow"><a class="table-link" th:href="@{/suppliers}">SUPPLIERS</a></span><h1 th:text="${supplierId != null ? 'Edit supplier' : 'Add supplier'}"></h1></div></header><section class="panel form-panel"><form th:action="${supplierId != null ? '/suppliers/' + supplierId : '/suppliers'}" th:object="${form}" method="post" class="form-grid"><label class="wide">Supplier name<input th:field="*{name}" required maxlength="160"><small class="error" th:errors="*{name}"></small></label><label>Contact person<input th:field="*{contactPerson}" maxlength="120"></label><label>Email<input type="email" th:field="*{email}" maxlength="254"><small class="error" th:errors="*{email}"></small></label><label>Phone<input th:field="*{phone}" maxlength="50"></label><label class="wide">Address<textarea th:field="*{address}" rows="2" maxlength="500"></textarea></label><label class="wide">Notes<textarea th:field="*{notes}" rows="3" maxlength="4000"></textarea></label><label class="check"><input type="checkbox" th:field="*{active}"> Active supplier</label><div class="form-actions wide"><a class="secondary link-button" th:href="@{/suppliers}">Cancel</a><button class="primary" type="submit">Save supplier</button></div></form></section></main></div></body></html>
