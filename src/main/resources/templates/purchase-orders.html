<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Orders · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">WORKSPACE</span><strong th:text="${#authentication.name}"></strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a th:href="@{/inventory}">Inventory</a><a th:href="@{/orders}">Orders</a><a th:href="@{/suppliers}">Suppliers</a><a class="active" th:href="@{/purchase-orders}">Purchase Orders</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow">REPLENISHMENT</span><h1>Purchase Orders</h1></div><a class="primary link-button" th:href="@{/purchase-orders/new}">＋ Create purchase order</a></header><div class="notice" th:if="${purchaseSuccess}" th:text="${purchaseSuccess}"></div><div class="error" th:if="${purchaseError}" th:text="${purchaseError}"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>ORDER</th><th>SUPPLIER</th><th>DESTINATION</th><th>ITEMS</th><th>TOTAL</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody><tr th:each="po : ${purchaseOrders}"><td><strong th:text="${po.orderNumber}"></strong><small class="subline" th:text="${po.createdAt != null ? #temporals.format(po.createdAt,'dd MMM yyyy') : ''}"></small></td><td th:text="${po.supplier.name}"></td><td th:text="${po.location.name}"></td><td><details class="item-details"><summary th:text="${po.items.size() + ' item(s)'}"></summary><div th:each="item : ${po.items}" class="order-line"><span th:text="${item.productName + ' · ' + item.receivedQuantity + '/' + item.orderedQuantity}"></span><span th:text="${#numbers.formatDecimal(item.lineTotal,1,2)}"></span><form th:if="${(po.status.name() == 'ORDERED' or po.status.name() == 'PARTIALLY_RECEIVED') and item.outstanding.signum() > 0}" th:action="@{/purchase-orders/{id}/receipts(id=${po.id})}" method="post" class="receipt-inline"><input type="hidden" name="itemId" th:value="${item.id}"><input name="reference" maxlength="120" required placeholder="Receipt reference"><input name="quantity" type="number" min="0.001" step="0.001" th:attr="max=${item.outstanding}" required placeholder="Qty"><button class="mini-button" type="submit">Receive</button></form></div></details></td><td th:text="${#numbers.formatDecimal(po.total,1,2)}"></td><td><span class="badge" th:classappend="${po.status.name() == 'RECEIVED' ? ' green' : (po.status.name() == 'CANCELLED' ? ' gray' : ' amber')}" th:text="${#strings.replace(po.status.name(),'_',' ')}"></span></td><td><div class="row-actions"><form th:if="${po.status.name() == 'DRAFT'}" th:action="@{/purchase-orders/{id}/place(id=${po.id})}" method="post"><button class="mini-button" type="submit">Place order</button></form><form th:if="${po.status.name() == 'DRAFT' or po.status.name() == 'ORDERED'}" th:action="@{/purchase-orders/{id}/cancel(id=${po.id})}" method="post"><button class="mini-button danger" type="submit">Cancel</button></form></div></td></tr><tr th:if="${#lists.isEmpty(purchaseOrders)}"><td class="empty-row" colspan="7"><strong>No purchase orders yet</strong><p>Create a purchase order; stock is added only when goods are received.</p><a class="table-link" th:href="@{/purchase-orders/new}">Create purchase order</a></td></tr></tbody></table></div></section></main></div></body></html>
