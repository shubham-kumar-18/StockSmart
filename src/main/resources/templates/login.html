<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="/">StockSmart</a><h1>Welcome back</h1><p class="muted">Sign in to manage your inventory workspace.</p><div class="notice" th:if="${param.registered}">Your workspace is ready. Sign in to continue.</div><div class="notice" th:if="${param.logout}">You have signed out.</div><div class="error" th:if="${param.error}">Email or password was incorrect.</div><form th:action="@{/login}" method="post"><label>Email<input type="email" name="username" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sign in</button></form><p class="foot">New to StockSmart? <a th:href="@{/register}">Create a workspace</a></p></main></body></html>
