<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">SETUP</span><strong>Location setup</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a class="active" th:href="@{/locations}">Locations</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow"><a class="table-link" th:href="@{/locations}">LOCATIONS</a></span><h1 th:text="${locationId != null ? 'Edit location' : 'Add location'}"></h1></div></header><section class="panel form-panel"><div class="error" th:if="${formError}" th:text="${formError}"></div><form th:action="${locationId != null ? '/locations/' + locationId : '/locations'}" th:object="${form}" method="post" class="form-grid"><label>Location name<input th:field="*{name}" required maxlength="120"><small class="error" th:errors="*{name}"></small></label><label>Location code<input th:field="*{code}" required maxlength="40"><small class="error" th:errors="*{code}"></small></label><label>Location type<select th:field="*{type}"><option value="WAREHOUSE">Warehouse</option><option value="STORE">Store</option></select></label><label>Contact information<input th:field="*{contactInfo}" maxlength="160"></label><label class="wide">Address<textarea th:field="*{address}" rows="3" maxlength="500"></textarea></label><label class="check"><input type="checkbox" th:field="*{active}"> Active location</label><div class="form-actions wide"><a class="secondary link-button" th:href="@{/locations}">Cancel</a><button class="primary" type="submit">Save location</button></div></form><p class="helper">Locations with inventory or transaction history will be retained when deactivated.</p></section></main></div></body></html>
