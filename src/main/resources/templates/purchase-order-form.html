<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create purchase order · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">PURCHASING</span><strong>New purchase order</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/inventory}">Inventory</a><a class="active" th:href="@{/purchase-orders}">Purchase Orders</a><a th:href="@{/suppliers}">Suppliers</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow"><a class="table-link" th:href="@{/purchase-orders}">PURCHASE ORDERS</a></span><h1>Create purchase order</h1></div></header><section class="panel form-panel"><div class="error" th:if="${formError}" th:text="${formError}"></div><form th:action="@{/purchase-orders}" th:object="${form}" method="post" class="form-grid"><label>Supplier<select th:field="*{supplierId}" required><option value="">Select supplier</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></label><label>Destination location<select th:field="*{locationId}" required><option value="">Select location</option><option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name + ' · ' + l.code}"></option></select></label><div class="wide"><div class="line-heading"><strong>Products</strong><button id="add-line" class="secondary" type="button">＋ Add product</button></div><div id="order-lines"><div class="order-input-row"><label>Product<select name="items[0].productId" data-field="productId" required><option value="">Select product</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' · ' + p.sku}"></option></select></label><label>Quantity<input name="items[0].quantity" data-field="quantity" type="number" min="0.001" step="0.001" required></label><label>Unit cost<input name="items[0].unitCost" data-field="unitCost" type="number" min="0" step="0.01" required></label><button class="remove-line secondary" type="button">Remove</button></div></div></div><div class="form-actions wide"><a class="secondary link-button" th:href="@{/purchase-orders}">Cancel</a><button class="primary" type="submit">Save draft</button></div></form><template id="line-template"><div class="order-input-row"><label>Product<select data-field="productId" required><option value="">Select product</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' · ' + p.sku}"></option></select></label><label>Quantity<input data-field="quantity" type="number" min="0.001" step="0.001" required></label><label>Unit cost<input data-field="unitCost" type="number" min="0" step="0.01" required></label><button class="remove-line secondary" type="button">Remove</button></div></template><p class="helper">Purchase costs and product identity are saved as snapshots. Only actual receipts increase inventory.</p></section></main></div><script th:src="@{/js/order-form.js}" defer></script></body></html>
