<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create order · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">SALES</span><strong>New order</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a th:href="@{/inventory}">Inventory</a><a class="active" th:href="@{/orders}">Orders</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow"><a class="table-link" th:href="@{/orders}">ORDERS</a></span><h1>Create order</h1></div></header><section class="panel form-panel"><div class="error" th:if="${formError}" th:text="${formError}"></div><p class="helper">Order prices use each product's current selling price and are saved as a snapshot. Confirming reserves available stock. Fulfillment deducts it once.</p><form th:action="@{/orders}" th:object="${form}" method="post" class="form-grid order-form"><label class="wide">Source location<select th:field="*{locationId}" required><option value="">Select location</option><option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name + ' · ' + l.code}"></option></select></label><div class="wide"><div class="line-heading"><strong>Order items</strong><button id="add-line" class="secondary" type="button">＋ Add item</button></div><div id="order-lines"><div class="order-input-row"><label>Product<select name="items[0].productId" data-field="productId" required><option value="">Select product</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' · ' + p.sku + ' · ' + #numbers.formatDecimal(p.sellingPrice,1,2)}"></option></select></label><label>Quantity<input name="items[0].quantity" data-field="quantity" type="number" min="0.001" step="0.001" required></label><button class="remove-line secondary" type="button" aria-label="Remove item">Remove</button></div></div></div><div class="form-actions wide"><a class="secondary link-button" th:href="@{/orders}">Cancel</a><button class="primary" type="submit">Save draft order</button></div></form><template id="line-template"><div class="order-input-row"><label>Product<select data-field="productId" required><option value="">Select product</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' · ' + p.sku + ' · ' + #numbers.formatDecimal(p.sellingPrice,1,2)}"></option></select></label><label>Quantity<input data-field="quantity" type="number" min="0.001" step="0.001" required></label><button class="remove-line secondary" type="button" aria-label="Remove item">Remove</button></div></template></section></main></div><script th:src="@{/js/order-form.js}" defer></script></body></html>
