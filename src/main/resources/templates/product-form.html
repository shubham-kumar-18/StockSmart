<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${productId != null ? 'Edit product' : 'Add product'} + ' · StockSmart'">Product · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">CATALOG</span><strong>Product setup</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a class="active" th:href="@{/products}">Products</a><a th:href="@{/locations}">Locations</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow"><a class="table-link" th:href="@{/products}">PRODUCTS</a></span><h1 th:text="${productId != null ? 'Edit product' : 'Add product'}"></h1></div></header><section class="panel form-panel"><div class="error" th:if="${formError}" th:text="${formError}"></div><form th:action="${productId != null ? '/products/' + productId : '/products'}" th:object="${form}" method="post" class="form-grid"><label class="wide">Product name<input th:field="*{name}" required maxlength="160"><small class="error" th:errors="*{name}"></small></label><label>SKU<input th:field="*{sku}" required maxlength="80"><small class="error" th:errors="*{sku}"></small></label><label>Category<select th:field="*{categoryId}"><option value="">Uncategorized</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Selling price<input type="number" th:field="*{sellingPrice}" min="0" step="0.01" required></label><label>Cost price<input type="number" th:field="*{costPrice}" min="0" step="0.01"></label><label>Barcode<input th:field="*{barcode}" maxlength="120"></label><label>Unit of measure<input th:field="*{unit}" maxlength="30" required placeholder="each, kg, box"></label><label>Reorder level<input type="number" th:field="*{reorderLevel}" min="0" step="0.001" required></label><label class="wide">Description<textarea th:field="*{description}" rows="3" maxlength="4000"></textarea></label><label class="check"><input type="checkbox" th:field="*{active}"> Active product</label><div class="form-actions wide"><a class="secondary link-button" th:href="@{/products}">Cancel</a><button class="primary" type="submit">Save product</button></div></form><p class="helper">Saving a product does not create stock. Opening stock will be recorded through inventory management.</p></section></main></div></body></html>
