<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">WORKSPACE</span><strong th:text="${#authentication.name}"></strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a th:href="@{/locations}">Locations</a><a th:href="@{/inventory}">Inventory</a><a class="active" th:href="@{/orders}">Orders</a><a th:href="@{/suppliers}">Suppliers</a><a th:href="@{/reports}">Reports</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow">SALES</span><h1>Orders</h1></div><a class="primary link-button" th:href="@{/orders/new}">＋ Create order</a></header><div class="notice" th:if="${orderSuccess}" th:text="${orderSuccess}"></div><div class="error" th:if="${orderError}" th:text="${orderError}"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>ORDER</th><th>CREATED</th><th>LOCATION</th><th>ITEMS</th><th>SUBTOTAL</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody><tr th:each="o : ${orders}"><td><strong th:text="${o.orderNumber}"></strong><details class="item-details"><summary>View items</summary><div th:each="item : ${o.items}" class="order-line"><span th:text="${item.productName + ' (' + item.sku + ')'}"></span><span th:text="${item.quantity + ' × ' + #numbers.formatDecimal(item.unitPrice,1,2)}"></span></div></details></td><td th:text="${o.createdAt != null ? #temporals.format(o.createdAt,'dd MMM yyyy HH:mm') : '—'}"></td><td th:text="${o.location.name}"></td><td th:text="${o.items.size()}"></td><td th:text="${#numbers.formatDecimal(o.subtotal,1,2)}"></td><td><span class="badge" th:classappend="${o.status.name() == 'FULFILLED' ? ' green' : (o.status.name() == 'CANCELLED' ? ' gray' : ' amber')}" th:text="${o.status}"></span></td><td><div class="row-actions"><form th:if="${o.status.name() == 'DRAFT'}" th:action="@{/orders/{id}/confirm(id=${o.id})}" method="post"><button class="mini-button" type="submit">Confirm</button></form><form th:if="${o.status.name() == 'CONFIRMED'}" th:action="@{/orders/{id}/fulfill(id=${o.id})}" method="post"><button class="mini-button" type="submit">Fulfill</button></form><form th:if="${o.status.name() == 'DRAFT' or o.status.name() == 'CONFIRMED'}" th:action="@{/orders/{id}/cancel(id=${o.id})}" method="post"><button class="mini-button danger" type="submit">Cancel</button></form></div></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="empty-row"><strong>No orders yet</strong><p>Create a draft order with one or more products, then confirm it to reserve stock.</p><a class="table-link" th:href="@{/orders/new}">Create the first order</a></td></tr></tbody></table></div><div class="table-foot" th:text="${orders.size() + ' order(s)'}"></div></section></main></div></body></html>
