<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">WORKSPACE</span><strong th:text="${#authentication.name}"></strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a th:href="@{/inventory}">Inventory</a><a th:href="@{/orders}">Orders</a><a class="active" th:href="@{/suppliers}">Suppliers</a><a th:href="@{/purchase-orders}">Purchase Orders</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow">PURCHASING</span><h1>Suppliers</h1></div><a class="primary link-button" th:href="@{/suppliers/new}">＋ Add supplier</a></header><section class="panel"><form class="filters" th:action="@{/suppliers}" method="get"><input name="q" th:value="${q}" placeholder="Search supplier name, email or phone"><button class="secondary">Search</button><a class="text-button" th:href="@{/suppliers}">Clear</a></form><div class="table-wrap"><table><thead><tr><th>SUPPLIER</th><th>CONTACT</th><th>EMAIL</th><th>PHONE</th><th>STATUS</th><th></th></tr></thead><tbody><tr th:each="s : ${suppliers}"><td><a class="table-link" th:href="@{/suppliers/{id}(id=${s.id})}" th:text="${s.name}"></a><small class="subline" th:text="${s.address}"></small></td><td th:text="${s.contactPerson != null ? s.contactPerson : '—'}"></td><td th:text="${s.email != null ? s.email : '—'}"></td><td th:text="${s.phone != null ? s.phone : '—'}"></td><td><span class="badge" th:classappend="${s.active ? ' green' : ' gray'}" th:text="${s.active ? 'Active' : 'Inactive'}"></span></td><td><a class="table-link" th:href="@{/suppliers/{id}/edit(id=${s.id})}">Edit</a></td></tr><tr th:if="${#lists.isEmpty(suppliers)}"><td class="empty-row" colspan="6"><strong>No suppliers found</strong><p>Add a supplier to start recording purchases.</p><a class="table-link" th:href="@{/suppliers/new}">Add supplier</a></td></tr></tbody></table></div></section></main></div></body></html>
