<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barcode lookup · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">LOOKUP</span><strong>Barcode scanner</strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/products}">Products</a><a th:href="@{/inventory}">Inventory</a><a class="active" th:href="@{/barcode}">Barcode lookup</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow">PRODUCT LOOKUP</span><h1>Barcode scanner</h1></div></header><section class="panel"><p class="muted">Connect a USB barcode scanner that types into the field and submits with Enter, or enter a barcode manually.</p><form th:action="@{/barcode}" method="get" class="filters barcode-form"><input id="barcode-code" name="code" th:value="${code}" autofocus autocomplete="off" placeholder="Scan or type barcode" required><button class="primary" type="submit">Find product</button></form><div class="error" th:if="${lookupError}" th:text="${lookupError}"></div></section><section class="panel" th:if="${product != null}"><h2 class="section-title" th:text="${product.name}"></h2><p class="muted" th:text="${'SKU ' + product.sku + ' · Barcode ' + product.barcode}"></p><div class="table-wrap"><table><thead><tr><th>LOCATION</th><th>ON HAND</th><th>RESERVED</th><th>AVAILABLE</th></tr></thead><tbody><tr th:each="row : ${stock}"><td th:text="${row.location.name}"></td><td th:text="${row.quantity + ' ' + product.unit}"></td><td th:text="${row.reservedQuantity + ' ' + product.unit}"></td><td th:text="${row.availableQuantity + ' ' + product.unit}"></td></tr><tr th:if="${#lists.isEmpty(stock)}"><td colspan="4" class="empty-row">No stock records exist for this product yet.</td></tr></tbody></table></div></section></main></div></body></html>
