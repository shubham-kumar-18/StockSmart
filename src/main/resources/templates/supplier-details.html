<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier history · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/dashboard}">StockSmart</a><div class="workspace"><span class="eyebrow">PURCHASING</span><strong th:text="${supplier.name}"></strong></div><nav><a th:href="@{/dashboard}">Overview</a><a th:href="@{/suppliers}">Suppliers</a><a class="active" th:href="@{/purchase-orders}">Purchase Orders</a></nav></aside><main class="content"><header class="topbar"><div><span class="eyebrow">SUPPLIER</span><h1 th:text="${supplier.name}"></h1></div><a class="secondary link-button" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">Edit supplier</a></header><section class="panel"><h2 class="section-title">Contact details</h2><p th:text="${supplier.contactPerson != null ? supplier.contactPerson : 'No contact person recorded'}"></p><p th:text="${supplier.email != null ? supplier.email : 'No email recorded'}"></p><p th:text="${supplier.phone != null ? supplier.phone : 'No phone recorded'}"></p><p th:text="${supplier.address != null ? supplier.address : 'No address recorded'}"></p><p th:text="${supplier.notes}"></p></section><section class="panel"><h2 class="section-title">Purchase history</h2><div class="table-wrap"><table><thead><tr><th>ORDER</th><th>DATE</th><th>DESTINATION</th><th>STATUS</th><th>ORDER TOTAL</th></tr></thead><tbody><tr th:each="po : ${purchaseOrders}"><td th:text="${po.orderNumber}"></td><td th:text="${po.createdAt != null ? #temporals.format(po.createdAt,'dd MMM yyyy') : '—'}"></td><td th:text="${po.location.name}"></td><td th:text="${po.status}"></td><td th:text="${#numbers.formatDecimal(po.total,1,2)}"></td></tr><tr th:if="${#lists.isEmpty(purchaseOrders)}"><td colspan="5" class="empty-row">No purchase orders for this supplier yet.</td></tr></tbody></table></div></section></main></div></body></html>
