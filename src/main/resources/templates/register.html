<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create workspace · StockSmart</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="/">StockSmart</a><h1>Create your workspace</h1><p class="muted">Your account will be its administrator. You can add locations and products later.</p><div class="error" th:if="${registrationError}" th:text="${registrationError}"></div><form th:action="@{/register}" th:object="${form}" method="post"><label>Business or workspace name<input th:field="*{organizationName}" required maxlength="120"><small class="error" th:errors="*{organizationName}"></small></label><label>Your name<input th:field="*{fullName}" autocomplete="name" required maxlength="120"><small class="error" th:errors="*{fullName}"></small></label><label>Email<input type="email" th:field="*{email}" autocomplete="email" required><small class="error" th:errors="*{email}"></small></label><label>Password<input type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required><small class="error" th:errors="*{password}"></small></label><label>Confirm password<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required></label><button class="primary full" type="submit">Create workspace</button></form><p class="foot">Already registered? <a th:href="@{/login}">Sign in</a></p></main></body></html>
